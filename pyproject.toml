[project]
name = "mouth-monitor"
version = "0.1.0"
description = "完全本地运行的 Windows 持续张嘴提醒工具"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Mouth Monitor Contributors" }]
dependencies = [
  "fastapi==0.127.0",
  "mediapipe==0.10.21",
  "numpy==1.26.4",
  "uvicorn==0.40.0",
  "websockets==15.0.1",
]

[project.scripts]
mouth-monitor = "mouth_monitor.__main__:main"

[dependency-groups]
dev = [
  "httpx>=0.28,<0.29",
  "pytest>=8.4,<9",
]
build = [
  "pyinstaller>=6.15,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mouth_monitor"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
